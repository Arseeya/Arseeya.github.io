<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下载 · Arseeya</title>
    <style>
        /* 全局重置，确保纯白极简 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin: 0;
        }

        .download-container {
            text-align: center;
            max-width: 480px;
            width: 100%;
        }

        /* 极简标题 */
        .site-title {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #1a1a1a;
            margin-bottom: 0.25rem;
        }

        .site-sub {
            font-size: 0.9rem;
            font-weight: 300;
            color: #888;
            letter-spacing: 0.05em;
            margin-bottom: 3rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 2rem;
        }

        /* 下载卡片 - 极简线条风格 */
        .download-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.2rem 0;
            border-bottom: 1px solid #f0f0f0;
            text-decoration: none;
            color: #1a1a1a;
            transition: opacity 0.2s ease;
        }

        .download-item:last-child {
            border-bottom: none;
        }

        .download-item:hover {
            opacity: 0.6;
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* 简单文件图标 */
        .file-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 300;
            color: #aaa;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            background: #fafafa;
        }

        .file-name {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .file-ext {
            font-size: 0.7rem;
            color: #aaa;
            margin-left: 0.3rem;
            font-weight: 300;
        }

        .download-arrow {
            color: #ccc;
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .download-item:hover .download-arrow {
            transform: translateX(3px);
        }

        /* 底部脚注 */
        .footer-note {
            margin-top: 3.5rem;
            font-size: 0.75rem;
            color: #ccc;
            letter-spacing: 0.05em;
            font-weight: 300;
        }

        /* 移动端调整 */
        @media (max-width: 480px) {
            .site-title { font-size: 1.5rem; }
            .download-item { padding: 1rem 0; }
            .file-name { font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <div class="download-container">

        <!-- 极简标题区 -->
        <h1 class="site-title">Arseeya</h1>
        <p class="site-sub">· 下载 ·</p>

        <!-- 下载链接列表 -->
        <a class="download-item" href="/downloads/word/word.jpg" download>
            <span class="file-info">
                <span class="file-icon">🖼</span>
                <span class="file-name">
                    word
                    <span class="file-ext">.jpg</span>
                </span>
            </span>
            <span class="download-arrow">↓</span>
        </a>

        <a class="download-item" href="/downloads/word/答案.zip" download>
            <span class="file-info">
                <span class="file-icon">📦</span>
                <span class="file-name">
                    答案
                    <span class="file-ext">.zip</span>
                </span>
            </span>
            <span class="download-arrow">↓</span>
        </a>

        <!-- 极简脚注 -->
        <p class="footer-note">泽尔集团 · 内部资源</p>

    </div>

</body>
</html>
